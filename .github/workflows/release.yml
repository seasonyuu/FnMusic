name: Release APK

on:
  push:
    branches:
      - main
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  debug:
    name: Build debug APK
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    env:
      ORG_GRADLE_PROJECT_signingStoreFile: ${{ github.workspace }}/fn-music-release.keystore
      ORG_GRADLE_PROJECT_signingStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ORG_GRADLE_PROJECT_signingKeyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
      ORG_GRADLE_PROJECT_signingKeyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
      EXPECTED_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Show debug version
        run: ./scripts/git-version.sh

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ORG_GRADLE_PROJECT_signingStoreFile"
          test -s "$ORG_GRADLE_PROJECT_signingStoreFile"

      - name: Build debug APK
        run: ./gradlew test lint assembleDebug

      - name: Verify APK signature
        env:
          APK_PATH: app/build/outputs/apk/debug/app-debug.apk
        run: |
          set -euo pipefail

          test -s "$APK_PATH"
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner_path"

          certificate_info="$("$apksigner_path" verify --verbose --print-certs "$APK_PATH" 2>&1)"
          actual_fingerprint="$(printf '%s\n' "$certificate_info" | awk '/certificate SHA-256 digest:/ {print $NF; exit}' | tr -d '[:space:]: ' | tr '[:lower:]' '[:upper:]')"
          expected_fingerprint="$(printf '%s' "$EXPECTED_SIGNING_CERT_SHA256" | tr -d '[:space:]: ' | tr '[:lower:]' '[:upper:]')"

          if [[ -z "$actual_fingerprint" || "$actual_fingerprint" != "$expected_fingerprint" ]]; then
            echo "APK signing certificate fingerprint does not match the expected value" >&2
            exit 1
          fi

      - name: Create checksum
        env:
          APK_PATH: app/build/outputs/apk/debug/app-debug.apk
        run: sha256sum "$APK_PATH" > "$APK_PATH.sha256"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: fnmusic-debug-${{ github.sha }}
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/debug/app-debug.apk.sha256
          if-no-files-found: error

      - name: Remove temporary signing keystore
        if: ${{ always() }}
        run: rm -f "$ORG_GRADLE_PROJECT_signingStoreFile"

  release:
    name: Build and publish signed APK
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    environment: production
    permissions:
      contents: write
    env:
      ORG_GRADLE_PROJECT_signingStoreFile: ${{ github.workspace }}/fn-music-release.keystore
      ORG_GRADLE_PROJECT_signingStorePassword: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ORG_GRADLE_PROJECT_signingKeyAlias: ${{ secrets.ANDROID_KEY_ALIAS }}
      ORG_GRADLE_PROJECT_signingKeyPassword: ${{ secrets.ANDROID_KEY_PASSWORD }}
      EXPECTED_SIGNING_CERT_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}

    steps:
      - name: Check out source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Validate release tag
        shell: bash
        run: |
          set -euo pipefail

          version_name=""
          version_code=""
          tag_name=""
          exact_tag=""
          version_output="$(./scripts/git-version.sh)"
          printf '%s\n' "$version_output"
          while IFS='=' read -r key value; do
            case "$key" in
              versionName) version_name="$value" ;;
              versionCode) version_code="$value" ;;
              tagName) tag_name="$value" ;;
              exactTag) exact_tag="$value" ;;
            esac
          done <<< "$version_output"

          if [[ "$exact_tag" != "true" || "$tag_name" != "$GITHUB_REF_NAME" ]]; then
            echo "Release ref must be the exact reachable version tag for this commit: $GITHUB_REF_NAME" >&2
            exit 1
          fi

          [[ -n "$version_name" ]]
          [[ -n "$version_code" ]]

      - name: Decode signing keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$ORG_GRADLE_PROJECT_signingStoreFile"
          test -s "$ORG_GRADLE_PROJECT_signingStoreFile"

      - name: Build release APK
        run: ./gradlew test lint assembleRelease

      - name: Verify APK signature
        env:
          APK_PATH: app/build/outputs/apk/release/app-release.apk
        run: |
          set -euo pipefail

          test -s "$APK_PATH"
          apksigner_path="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -x "$apksigner_path"

          certificate_info="$("$apksigner_path" verify --verbose --print-certs "$APK_PATH" 2>&1)"
          actual_fingerprint="$(printf '%s\n' "$certificate_info" | awk '/certificate SHA-256 digest:/ {print $NF; exit}' | tr -d '[:space:]: ' | tr '[:lower:]' '[:upper:]')"
          expected_fingerprint="$(printf '%s' "$EXPECTED_SIGNING_CERT_SHA256" | tr -d '[:space:]: ' | tr '[:lower:]' '[:upper:]')"

          if [[ -z "$actual_fingerprint" || "$actual_fingerprint" != "$expected_fingerprint" ]]; then
            echo "APK signing certificate fingerprint does not match the expected value" >&2
            exit 1
          fi

      - name: Create checksum
        env:
          APK_PATH: app/build/outputs/apk/release/app-release.apk
        run: sha256sum "$APK_PATH" > "$APK_PATH.sha256"

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          APK_PATH: app/build/outputs/apk/release/app-release.apk
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "$APK_PATH" \
            "$APK_PATH.sha256" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes

      - name: Remove temporary signing keystore
        if: ${{ always() }}
        run: rm -f "$ORG_GRADLE_PROJECT_signingStoreFile"
